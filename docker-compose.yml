services:
  postgres:
    image: postgres:16
    container_name: kielimuisti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kielimuisti
    # Use 5433 on the host so a local Postgres on 5432 does not steal connections.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
